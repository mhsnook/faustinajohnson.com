# Delta-reporting PR checks.
#
# Shape: one job per TREE, not one per check. `head` and `base` each install
# once and build once, then run every check that tree can answer. They run in
# parallel with each other. `report` fans in, diffs the two, posts a single
# comment, and owns the pass/fail decision.
#
# Total cost: 2 installs, 2 builds — whatever the number of checks.

name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"

jobs:
  # ── The PR's tree ─────────────────────────────────────────────────────
  # Install once, build once, then run everything off that one tree: the static
  # checks, the bundle measurement, the tests.
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No version pin: pnpm/action-setup reads the `packageManager` field in
      # package.json, which is where this repo's pnpm version already lives.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # pnpm-workspace.yaml sets minimumReleaseAge and blockExoticSubdeps.
      # --frozen-lockfile keeps CI on the exact resolutions those policies
      # already vetted, rather than re-resolving against the live registry.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The formatter gate is scoped to the files this PR touches, so the head
      # tree has to say which those are. Two-dot diff, because the default
      # checkout for `pull_request` is the MERGE ref — base already merged in —
      # so base.sha..HEAD is exactly this PR's own changes.
      - name: List files this PR touches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/out/static
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only --diff-filter=d "$BASE_SHA" HEAD |
            sort >/tmp/out/static/touched.txt
          wc -l /tmp/out/static/touched.txt

      # Checks 1–3. Read-only checks run concurrently inside the script; the
      # formatters run last because they rewrite files.
      - name: Static checks
        run: bash .github/ci/collect-static.sh /tmp/out/static

      # The build needs no Cloudflare credentials: @astrojs/cloudflare compiles
      # against the bindings declared in wrangler.jsonc without contacting the
      # account, and nothing here reads a build-time environment variable.
      - name: Build
        run: pnpm build

      # Check 4, head half. Measures only — the diff happens in `report`.
      - name: Measure bundle
        run: node .github/ci/measure-bundle.cjs dist /tmp/out/bundle.json

      # Check 5. continue-on-error so a failure still reaches the comment;
      # the report job owns the verdict.
      - name: Tests
        continue-on-error: true
        run: pnpm exec vitest run --reporter=json --outputFile=/tmp/test-results.json

      - name: Render test fragment
        if: ${{ !cancelled() }}
        run: |
          node -e "require('./.github/ci/render-tests.cjs')({
            results: '/tmp/test-results.json', out: '/tmp/out/fragments'
          })"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tree-head
          path: /tmp/out/
          retention-days: 1

  # ── The base branch's tree ────────────────────────────────────────────
  # Same install and build, but only the checks that need a comparison point.
  # No tests here — that is a head-only question.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # The scripts live on the head branch, so fetch them rather than using the
      # base branch's copy. Both trees must be measured by the SAME scripts, or
      # a change to a script itself shows up as a change in the codebase.
      - name: Fetch check scripts from head
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git checkout "${{ github.event.pull_request.head.sha }}" -- .github/ci/

      # The formatter and linter configs are part of the measurement too: if a
      # PR changes a rule, both trees must be judged by the new rule, or every
      # file in the repo reads as newly broken.
      # One `git checkout` per file: a single call listing all four fails as a
      # whole if any one path is missing, which would silently leave the base
      # tree measured by its own older configs.
      - name: Fetch tool configs from head
        run: |
          for f in .oxlintrc.json .oxfmtrc.json .prettierrc.json .prettierignore; do
            git checkout "${{ github.event.pull_request.head.sha }}" -- "$f" ||
              echo "no $f on head, leaving base copy in place"
          done

      - name: Static checks
        run: bash .github/ci/collect-static.sh /tmp/out/static

      - name: Build
        run: pnpm build

      - name: Measure bundle
        run: node .github/ci/measure-bundle.cjs dist /tmp/out/bundle.json

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tree-base
          path: /tmp/out/
          retention-days: 1

  # ── Fan-in: diff, one comment, one verdict ────────────────────────────
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [head, base]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: tree-head, path: /tmp/head }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: tree-base, path: /tmp/base }
        continue-on-error: true

      # The diff happens here, once, over artifacts. Neither tree is present.
      - name: Render fragments
        run: |
          mkdir -p /tmp/fragments
          cp -r /tmp/head/fragments/. /tmp/fragments/ 2>/dev/null || true
          node -e "require('./.github/ci/render-static.cjs')({
            head: '/tmp/head/static', base: '/tmp/base/static', out: '/tmp/fragments'
          })"
          node -e "require('./.github/ci/render-bundle.cjs')({
            head: '/tmp/head/bundle.json', base: '/tmp/base/bundle.json', out: '/tmp/fragments'
          })"

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const { assemble, upsertComment } = require('./.github/ci/comment.cjs')
            const marker = '### PR checks'
            const body = assemble('/tmp/fragments', {
              marker,
              header: `_Compared against \`${context.payload.pull_request.base.ref}\`._`,
            })
            core.info(JSON.stringify(await upsertComment(github, context, marker, body)))

      - name: Gate
        run: node .github/ci/gate.cjs /tmp/fragments
